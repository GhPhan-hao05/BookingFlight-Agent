<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chatbot Flight</title>
    <style>
        body {
            font-family: sans-serif;
            width: 60%;
            margin: auto;
            padding-top: 30px;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: #f4f7f9;
        }

        .message {
            display: flex;
            margin-bottom: 15px;
            align-items: flex-end;
        }

        .message.bot {
            flex-direction: row;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            font-size: 14px;
            line-height: 1.4;
        }

        .bot .bubble {
            background-color: #eee;
            color: #333;
        }

        .user .bubble {
            background-color: #007bff;
            color: white;
        }

        .form-box {
            margin-top: 15px;
            width: 100%;
        }

        .input-group {
            display: flex;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 30px;
            overflow: hidden;
            background-color: white;
        }

        #user-input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            font-size: 16px;
            outline: none;
        }

        #send-btn {
            background-color: #007bff;
            border: none;
            color: white;
            width: 50px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        #send-btn:hover {
            background-color: #005dc0;
        }
    </style>
</head>

<body>
    <nav>
        <a href="{{ url_for('index') }}">TEXT</a>
        <a href="{{ url_for('visual') }}">VOICE</a>
    </nav>
    <h2>✈️ Travel Assistant Chatbot</h2>

    <div class="chat-box" id="chat-box"></div>

    <div class="form-box">
        <form id="chat-form">
            <div class="input-group">
                <input type="text" id="user-input" placeholder="Type your message..." required />
                <button type="submit" id="send-btn">></button>
            </div>
        </form>
    </div>

    <div class="right">
        <h3>🛫 Chuyến bay</h3>
        <div id="flight-results"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("chat-form");
            const input = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const flightBox = document.getElementById("flight-results");


            function appendMessage(sender, text) {
                const messageDiv = document.createElement("div");
                messageDiv.className = `message ${sender}`;

                const bubble = document.createElement("div");
                bubble.className = "bubble";
                bubble.innerHTML = text;

                if (sender === "bot") {
                    const avatar = document.createElement("div");
                    avatar.className = "avatar";
                    avatar.textContent = "🤖";
                    messageDiv.appendChild(avatar);
                }

                messageDiv.appendChild(bubble);
                chatBox.appendChild(messageDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            function renderFlights(flights) {
                console.log("Rendering flights:", flights); // 🔍 DEBUG

                flightBox.innerHTML = "";
                flights.forEach(flight => {
                    const card = document.createElement("div");
                    card.className = "flight-card";
                    card.innerHTML = `
                    <strong>${flight.hang_bay}</strong><br>
                    ${flight.san_bay_di} → ${flight.san_bay_den}<br>
                    🕐 ${flight.gio_khoi_hanh} <br>
                    💰 ${flight.gia}
                `;
                    card.addEventListener("click", () => {
                        const msg = `Tôi chọn chuyến bay hãng ${flight.hang_bay} từ ${flight.san_bay_di} đến ${flight.san_bay_den} lúc ${flight.gio_khoi_hanh}`;
                        sendMessage(msg);
                    });
                    flightBox.appendChild(card);
                });
            }

            async function loadFlights() {
                try {
                    const res = await fetch("/static/flight_results.json");  // ensure file is in /static
                    const flights = await res.json();
                    renderFlights(flights);
                } catch (e) {
                    console.error("❌ Không thể tải dữ liệu chuyến bay.");
                }
            }


            async function sendMessage(text) {
                appendMessage("user", text);
                input.value = "";

                try {
                    const response = await fetch("/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: text })
                    });

                    const data = await response.json();
                    console.log("Chat response:", data);  // DEBUG

                    appendMessage("assistant", data.reply);

                    if (data.show_flights == true) {

                        loadFlights();
                        // delay load
                    }
                } catch (error) {
                    appendMessage("assistant", "⚠️ Đã xảy ra lỗi khi kết nối server.");
                }
            }


            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                const message = input.value.trim();
                if (!message) return;
                if (message) sendMessage(message);//+

                // appendMessage("user", message);
                // input.value = "";

                // try {
                //     const response = await fetch("/chat", {
                //         method: "POST",
                //         headers: { "Content-Type": "application/json" },
                //         body: JSON.stringify({ message }),
                //     });

                //     const data = await response.json();
                //     appendMessage("assistant", data.reply);
                // } catch (error) {
                //     appendMessage("assistant", "⚠️ Đã xảy ra lỗi khi kết nối server.");
                // }
            });
        });

    </script>
</body>

</html>
